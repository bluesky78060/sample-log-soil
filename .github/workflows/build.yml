name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm install

      - name: Create network-config with secrets
        run: |
          @"
          window.NETWORK_CONFIG = {
              ALLOWED_GATEWAY: '${{ secrets.ALLOWED_GATEWAY }}',
              VWORLD_API_KEY: '${{ secrets.VWORLD_API_KEY }}'
          };
          "@ | Out-File -FilePath "src/shared/network-config.js" -Encoding utf8
        shell: pwsh

      - name: Build Windows package
        run: npm run make

      - name: Create latest.yml for auto-updater
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exeFile = Get-ChildItem -Path "out/make/squirrel.windows/x64" -Filter "*Setup.exe" | Select-Object -First 1
          $exeSize = $exeFile.Length
          $exeHash = (Get-FileHash -Path $exeFile.FullName -Algorithm SHA512).Hash.ToLower()
          $content = @"
          version: $version
          files:
            - url: $($exeFile.Name)
              sha512: $exeHash
              size: $exeSize
          path: $($exeFile.Name)
          sha512: $exeHash
          releaseDate: $(Get-Date -Format "yyyy-MM-ddTHH:mm:ss.fffZ")
          "@
          $content | Out-File -FilePath "out/make/squirrel.windows/x64/latest.yml" -Encoding utf8
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: out/make/**/*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
            out/make/squirrel.windows/x64/latest.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
