<body>
    <div class="container">
        <a href="../feedback/index.html" class="back-link">← 게시판으로</a>
        <h1>🛠️ 관리자 — 문의/공지 관리</h1>

        <div class="alert-warn" id="webWarn" style="display: none;">
            이 페이지는 <strong>데스크톱 앱에서만</strong> 동작합니다(게시판 설정이 데스크톱에만 동봉됨).
        </div>

        <!-- 로그인 -->
        <div id="loginSection">
            <div class="card login-wrap">
                <h2>🔐 관리자 로그인</h2>
                <form id="loginForm">
                    <label for="adminEmail">이메일</label>
                    <input type="email" id="adminEmail" placeholder="admin@example.com" autocomplete="username" required>
                    <label for="adminPassword">비밀번호</label>
                    <input type="password" id="adminPassword" placeholder="비밀번호" autocomplete="current-password" required>
                    <button type="submit" class="btn-primary" id="loginBtn" style="width: 100%;">로그인</button>
                </form>
            </div>
        </div>

        <!-- 관리자 콘텐츠 -->
        <div id="adminSection" style="display: none;">
            <div class="topbar">
                <button class="btn-secondary" id="refreshBtn">🔄 새로고침</button>
                <button class="btn-secondary" id="logoutBtn">로그아웃</button>
            </div>

            <!-- 공지 관리 -->
            <div class="card">
                <h2><span>📢</span> 공지 작성</h2>
                <form id="noticeForm">
                    <label for="noticeTitle">제목</label>
                    <input type="text" id="noticeTitle" placeholder="공지 제목" maxlength="200">
                    <label for="noticeBody">내용</label>
                    <textarea id="noticeBody" placeholder="공지 내용" maxlength="2000"></textarea>
                    <button type="submit" class="btn-primary">공지 등록</button>
                </form>
                <div id="noticeList" style="margin-top: 1rem;"></div>
            </div>

            <!-- 문의 관리 -->
            <div class="card">
                <h2><span>🗂️</span> 문의 관리 <span class="count-badge" id="inquiryCount">0</span></h2>
                <div id="inquiryList"></div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
</body>
