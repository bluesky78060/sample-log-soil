    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; overflow-y: auto; }
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #FAF8F5 0%, #F5F3EF 50%, #FAF8F5 100%);
            min-height: 100%;
            padding: 2rem;
        }
        .container { max-width: 860px; margin: 0 auto; }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: #78716C; text-decoration: none; font-size: 0.875rem; margin-bottom: 1.5rem; }
        .back-link:hover { color: #7C9082; }
        h1 { font-size: 2rem; font-weight: 600; font-family: 'Fraunces', 'Noto Sans KR', serif; color: #3C3530; margin-bottom: 1.5rem; }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            padding: 1.6rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(60, 53, 48, 0.06);
            border: 1.5px solid #E8E4DF;
        }
        .card h2 { font-size: 1.2rem; font-weight: 600; font-family: 'Fraunces', 'Noto Sans KR', serif; color: #3C3530; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        label { display: block; font-size: 0.85rem; font-weight: 500; color: #6B6460; margin-bottom: 0.4rem; }
        /*
         * 🚨 `.card`를 앞에 붙여 구체성을 올린다 (SLS-1-246).
         *
         *    소스에서는 위 <link>(tailwind)가 이 <style>보다 앞이라 문제가 없어 보인다.
         *    그런데 **vite가 빌드하면서 CSS <link>를 </head> 근처로 옮긴다** —
         *    즉 배포본에서는 tailwind가 이 style **뒤**에 온다. 그러면 preflight의
         *        button,input,optgroup,select,textarea { margin:0; padding:0 }
         *    이 같은 구체성(요소 셀렉터)이면서 나중이라 그냥 `input`으로 쓰면
         *    **padding·margin이 통째로 덮인다.**
         *
         *    실제로 배포본에서 글자가 테두리에 붙고 입력란 간격이 사라져 있었다.
         *    개발 서버에서는 멀쩡해 보이므로 **빌드 산출물로 확인해야 하는 종류**다.
         */
        .card input, .card textarea, .card select {
            width: 100%; padding: 0.8rem 1.1rem; border: 1.5px solid #E8E4DF; border-radius: 8px;
            font-size: 0.875rem; font-family: inherit; background: #FAFAF9; margin-bottom: 0.9rem;
        }
        .card textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
        /* 체크박스는 위 규칙(width:100%)을 쓰면 안 된다 — 인라인 style로 이미 제외돼 있다 */
        .card input[type="checkbox"] { width: auto; margin-bottom: 0; padding: 0; }
        .card input:focus, .card textarea:focus, .card select:focus { outline: none; border-color: #7C9082; box-shadow: 0 0 0 3px rgba(124,144,130,0.12); }
        .btn-primary { background: #7C9082; color: #fff; border: none; border-radius: 8px; padding: 0.6rem 1.2rem; font-size: 0.875rem; font-weight: 500; cursor: pointer; }
        .btn-primary:hover { background: #6B7D72; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #64748b; color: #fff; border: none; border-radius: 8px; padding: 0.5rem 1rem; font-size: 0.8rem; cursor: pointer; }
        .btn-danger { background: #fee2e2; color: #dc2626; border: none; border-radius: 6px; padding: 0.3rem 0.7rem; font-size: 0.75rem; cursor: pointer; margin-top: 0.6rem; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .alert-warn { background: #fef3c7; border: 1px solid #fde68a; color: #92400e; padding: 0.9rem 1.1rem; border-radius: 10px; margin-bottom: 1rem; font-size: 0.9rem; }
        .hint { font-size: 0.875rem; color: #94a3b8; padding: 1.2rem; text-align: center; }
        .item { padding: 1rem; border: 1px solid #E8E4DF; border-radius: 10px; margin-bottom: 0.8rem; background: #FAFAF9; }
        .item-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.4rem; }
        .item .type { font-size: 0.72rem; font-weight: 600; color: #6B7D72; background: #E9EFEA; padding: 0.12rem 0.55rem; border-radius: 20px; }
        .item .meta { font-size: 0.74rem; color: #94a3b8; }
        .item .title { font-weight: 600; color: #3C3530; margin-bottom: 0.3rem; }
        .item .body { font-size: 0.875rem; color: #6B6460; line-height: 1.6; }
        .reply-area { margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px dashed #E8E4DF; }
        .reply-area select { max-width: 140px; }
        .count-badge { font-size: 0.8rem; color: #6B7D72; background: #E9EFEA; padding: 0.15rem 0.6rem; border-radius: 20px; }

        /* ── 탭 (SLS-1-252) — 게시판(src/feedback/index.html)의 패턴을 그대로 쓴다 ── */
        .board-tabs { display: flex; gap: 0.25rem; border-bottom: 2px solid #E8E4DF; margin-bottom: 1.25rem; }
        .board-tab {
            appearance: none; border: 0; background: transparent; font: inherit;
            font-size: 0.95rem; font-weight: 600; color: #94a3b8; cursor: pointer;
            padding: 0.65rem 1rem; border-radius: 10px 10px 0 0;
            border-bottom: 2px solid transparent; margin-bottom: -2px;
            display: inline-flex; align-items: center; gap: 0.4rem;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }
        .board-tab:hover { color: #6B6460; background: #FAFAF9; }
        .board-tab[aria-selected="true"] { color: #5C7A63; border-bottom-color: #7C9082; }
        .board-tab:focus-visible { outline: 2px solid #7C9082; outline-offset: -2px; }
        .board-tab .icon { font-size: 1.05rem; }
        .tab-badge { background: #7C9082; color: #fff; font-size: 0.7rem; font-weight: 700; border-radius: 999px; padding: 0.05rem 0.4rem; }
        .board-tab[aria-selected="false"] .tab-badge { background: #A8A29E; }
        @media (prefers-reduced-motion: reduce) { .board-tab { transition: none; } }
        [data-theme="dark"] .board-tabs { border-bottom-color: #57534E; }
        [data-theme="dark"] .board-tab { color: #A8A29E; }
        [data-theme="dark"] .board-tab:hover { color: #E7E5E4; background: #292524; }
        [data-theme="dark"] .board-tab[aria-selected="true"] { color: #A8B5A2; border-bottom-color: #7C9082; }

        /* ── 릴리스 배포 현황 (SLS-1-250) ── */
        .stat-figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.7rem; margin-bottom: 1.3rem; }
        .stat-figures .fig { border: 1px solid #E8E4DF; border-radius: 12px; padding: 0.85rem 1rem; background: #FAFAF9; }
        .stat-figures .k { font-size: 0.73rem; color: #94A3B8; margin-bottom: 0.25rem; }
        .stat-figures .v { font-family: 'Fraunces', 'Noto Sans KR', serif; font-size: 1.75rem; font-weight: 600; color: #3C3530; font-variant-numeric: tabular-nums; line-height: 1.15; }
        .stat-figures .v small { font-size: 0.85rem; font-weight: 500; color: #94A3B8; margin-left: 0.15rem; }
        .stat-label { font-size: 0.72rem; font-weight: 600; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.05em; margin: 1.3rem 0 0.6rem; }
        .stat-bar { display: grid; grid-template-columns: 5.2rem 1fr 2.4rem; align-items: center; gap: 0.7rem; font-size: 0.8rem; margin-bottom: 0.4rem; }
        .stat-bar .lab { color: #6B6460; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .stat-bar .track { background: #EFEDE9; border-radius: 5px; height: 10px; overflow: hidden; }
        .stat-bar .fill { display: block; height: 100%; background: #7C9082; border-radius: 5px; }
        .stat-bar .num { text-align: right; font-weight: 600; color: #3C3530; font-variant-numeric: tabular-nums; }
        /* 🚨 경고 상자 — 이 카드에서 가장 중요하다. 접거나 숨기지 않는다. */
        .stat-note { background: #FEF3C7; border: 1px solid #FDE68A; color: #92400E; padding: 0.85rem 1.05rem; border-radius: 10px; font-size: 0.82rem; margin-top: 1.4rem; line-height: 1.6; }
        .stat-note strong { display: block; margin-bottom: 0.3rem; }
        .stat-note ul { margin: 0.35rem 0 0 1.05rem; }
        .stat-note li { margin-bottom: 0.2rem; }
        .stats-fail { background: #FEF2F2; border: 1px solid #FECACA; color: #B91C1C; padding: 0.85rem 1.05rem; border-radius: 10px; font-size: 0.85rem; }
        /* 상한에 걸려 숫자가 잘렸음을 알린다 — 조용히 자르지 않는다 */
        .stats-partial { background: #FEF3C7; border: 1px solid #FDE68A; color: #92400E; padding: 0.7rem 1rem; border-radius: 8px; font-size: 0.8rem; margin-bottom: 1rem; }

        [data-theme="dark"] .stat-figures .fig { background: #1C1917; border-color: #57534E; }
        [data-theme="dark"] .stat-figures .v { color: #E7E5E4; }
        [data-theme="dark"] .stat-bar .lab { color: #A8A29E; }
        [data-theme="dark"] .stat-bar .num { color: #E7E5E4; }
        [data-theme="dark"] .stat-bar .track { background: #3A3633; }
        [data-theme="dark"] .stat-bar .fill { background: #8FA695; }
        [data-theme="dark"] .stat-note { background: #3A2F14; border-color: #5C4A1C; color: #FCD34D; }
        [data-theme="dark"] .stats-fail { background: #3A1C1C; border-color: #7F1D1D; color: #FCA5A5; }
        [data-theme="dark"] .stats-partial { background: #3A2F14; border-color: #5C4A1C; color: #FCD34D; }
        .login-wrap { max-width: 380px; margin: 3rem auto; }
        [data-theme="dark"] body { background: linear-gradient(135deg, #1C1917 0%, #292524 50%, #1C1917 100%); }
        [data-theme="dark"] .card { background: rgba(41,37,36,0.95); border-color: #57534E; }
        [data-theme="dark"] h1, [data-theme="dark"] .card h2, [data-theme="dark"] .item .title { color: #E7E5E4; }
        [data-theme="dark"] label { color: #A8A29E; }
        [data-theme="dark"] .card input, [data-theme="dark"] .card textarea, [data-theme="dark"] .card select { background: #1C1917; border-color: #57534E; color: #E7E5E4; }
        [data-theme="dark"] .item { background: #292524; border-color: #57534E; }
        [data-theme="dark"] .item .body { color: #A8A29E; }

        .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.75rem; }
        .toast { display: flex; align-items: center; gap: 0.75rem; padding: 1rem 1.25rem; background: #292524; color: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.18); animation: toastIn 0.3s ease; min-width: 260px; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
        .toast.success { background: #16a34a; } .toast.error { background: #dc2626; } .toast.warning { background: #f59e0b; color: #1c1917; } .toast.info { background: #2563eb; }
        .toast-icon { font-size: 1.2rem; } .toast-message { flex: 1; font-size: 0.875rem; font-weight: 500; }
    </style>

<body>
    <div class="container">
        <a href="../feedback/index.html" class="back-link">← 게시판으로</a>
        <h1>🛠️ 관리자 — 문의/공지 관리</h1>

        <div class="alert-warn" id="webWarn" style="display: none;">
            이 페이지는 <strong>데스크톱 앱에서만</strong> 동작합니다(게시판 설정이 데스크톱에만 동봉됨).
        </div>

        <!-- 로그인 -->
        <div id="loginSection">
            <div class="card login-wrap">
                <h2>🔐 관리자 로그인</h2>
                <form id="loginForm">
                    <label for="adminEmail">이메일</label>
                    <input type="email" id="adminEmail" placeholder="admin@example.com" autocomplete="username" required>
                    <label for="adminPassword">비밀번호</label>
                    <input type="password" id="adminPassword" placeholder="비밀번호" autocomplete="current-password" required>
                    <!-- 이메일 기억 (SLS-1-254) — 비밀번호는 저장하지 않는다.
                         ⚠️ width:auto 인라인 — .card input의 width:100%가 체크박스에 걸리면 안 된다 -->
                    <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: 500; margin-bottom: 0.9rem;">
                        <input type="checkbox" id="rememberEmail" checked style="width: auto; margin: 0;">
                        이메일 기억
                    </label>
                    <button type="submit" class="btn-primary" id="loginBtn" style="width: 100%;">로그인</button>
                </form>
            </div>
        </div>

        <!-- 관리자 콘텐츠 -->
        <div id="adminSection" style="display: none;">
            <div class="topbar">
                <button class="btn-secondary" id="refreshBtn">🔄 새로고침</button>
                <button class="btn-secondary" id="logoutBtn">로그아웃</button>
            </div>

            <!-- 탭 (SLS-1-252)
                 ⚠️ 초기 상태를 **마크업에 그대로** 적는다. JS에만 맡기면 스크립트 로드 전
                    세 패널이 모두 보이고, 스크립트가 죽으면 상태가 깨진다. -->
            <div class="board-tabs" role="tablist" aria-label="관리자 메뉴">
                <button type="button" class="board-tab" role="tab" id="tabNoticeAdmin"
                        aria-selected="false" aria-controls="panelNoticeAdmin" data-tab="notice">
                    <span class="icon">📢</span>공지
                </button>
                <button type="button" class="board-tab" role="tab" id="tabInquiryAdmin"
                        aria-selected="true" aria-controls="panelInquiryAdmin" data-tab="inquiry">
                    <span class="icon">🗂️</span>문의<span class="tab-badge" id="inquiryCount">0</span>
                </button>
                <button type="button" class="board-tab" role="tab" id="tabStatsAdmin"
                        aria-selected="false" aria-controls="panelStatsAdmin" data-tab="stats">
                    <span class="icon">📦</span>현황
                </button>
            </div>

            <!-- 공지 관리 -->
            <div id="panelNoticeAdmin" role="tabpanel" aria-labelledby="tabNoticeAdmin" hidden>
            <div class="card">
                <h2><span>📢</span> <span id="noticeFormTitle">공지 작성</span></h2>
                <form id="noticeForm">
                    <label for="noticeTitle">제목</label>
                    <input type="text" id="noticeTitle" placeholder="공지 제목" maxlength="200">
                    <label for="noticeBody">내용</label>
                    <textarea id="noticeBody" placeholder="공지 내용" maxlength="2000"></textarea>

                    <!-- 팝업 알림 (SLS-1-219) — 기본 꺼짐.
                         모든 공지를 팝업으로 띄우면 사용자가 읽지 않고 닫는 습관이 생겨
                         정작 중요할 때 놓친다. 반드시 알아야 하는 것만 켠다. -->
                    <label style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.75rem; font-weight: 500;">
                        <input type="checkbox" id="noticePopup" style="width: auto; margin: 0;">
                        앱 실행 시 팝업으로 알림
                    </label>
                    <small style="display: block; color: #94a3b8; margin: 0.25rem 0 0.5rem 1.6rem;">
                        데스크톱 앱에서만 뜹니다. 사용자가 한 번 확인하면 다시 뜨지 않습니다.
                    </small>

                    <label for="noticeUntil">팝업 표시 종료일 (선택)</label>
                    <input type="date" id="noticeUntil">
                    <small style="display: block; color: #94a3b8; margin: 0.25rem 0 0.5rem 0;">
                        <strong>팝업에만</strong> 적용됩니다 — 게시판 목록에는 계속 남습니다. 비워두면 팝업이 계속 뜹니다.
                    </small>

                    <div style="display: flex; align-items: center; gap: 0.6rem;">
                        <button type="submit" class="btn-primary" id="noticeSubmitBtn">공지 등록</button>
                        <button type="button" class="btn-secondary" id="noticeCancelBtn" hidden>편집 취소</button>
                    </div>
                    <!-- 수정해도 재팝업되지 않는 이유를 관리자가 알아야 판단할 수 있다 (SLS-1-245) -->
                    <small id="noticeEditHint" hidden
                           style="display: block; color: #94a3b8; margin-top: 0.5rem;">
                        수정해도 <strong>이미 읽으신 분께 다시 뜨지는 않습니다.</strong>
                        다시 알리려면 삭제 후 새로 등록하세요.
                    </small>
                </form>
                <div id="noticeList" style="margin-top: 1rem;"></div>
            </div>
            </div><!-- /panelNoticeAdmin -->

            <!-- 문의 관리 (기본 탭) -->
            <div id="panelInquiryAdmin" role="tabpanel" aria-labelledby="tabInquiryAdmin">
            <div class="card">
                <h2><span>🗂️</span> 문의 관리</h2>
                <div id="inquiryList"></div>
            </div>
            </div><!-- /panelInquiryAdmin -->

            <!-- 릴리스 배포 현황 (SLS-1-250) -->
            <div id="panelStatsAdmin" role="tabpanel" aria-labelledby="tabStatsAdmin" hidden>
            <div class="card">
                <h2><span>📦</span> 릴리스 배포 현황</h2>
                <!-- ⚠️ 문구가 동작과 맞아야 한다 (SLS-1-252 계획 리뷰).
                     지연 조회로 바꿨으므로 "로그인하면 표시됩니다"는 더 이상 사실이 아니다. -->
                <div id="releaseStats"><div class="hint">현황 탭을 열면 조회합니다.</div></div>
            </div>
            </div><!-- /panelStatsAdmin -->
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
</body>
