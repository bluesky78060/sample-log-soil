<body class="compost-analysis-page">
    <nav class="navbar ca-navbar">
        <button type="button" class="back-btn" id="backBtn" title="이전 페이지로"><span class="material-icons-outlined">arrow_back</span></button>
        <div class="navbar-brand">
            <span class="brand-icon">🐄</span>
        </div>

        <div class="navbar-divider"></div>

        <div class="navbar-actions ca-toolbar">
            <div class="toolbar-field">
                <label class="toolbar-label">연도</label>
                <span id="yearLabel" class="toolbar-static">-</span>
            </div>
            <div class="toolbar-field">
                <label class="toolbar-label" for="bulkTestDate">검사일자</label>
                <div class="toolbar-inline">
                    <input type="date" id="bulkTestDate" class="toolbar-input">
                    <button type="button" id="clearTestDateBtn" class="toolbar-btn-small" title="검사일자 일괄 삭제" aria-label="검사일자 일괄 삭제">✕</button>

            </div>
            <button type="button" id="applyBulkBtn" class="toolbar-btn" title="선택한 행에 일괄 적용">
                <span class="material-icons-outlined">playlist_add_check</span> 일괄 적용
            </button>
            <button type="button" id="importResultBtn" class="toolbar-btn" title="검정결과 가져오기">
                <span class="material-icons-outlined">upload_file</span> 결과 가져오기
            </button>
            <span id="recordCount" class="record-count">0건</span>
        </div>
    </nav>

    <main class="ca-main">
        <div id="emptyState" class="ca-empty" style="display:none;">
            <span class="material-icons-outlined">science</span>

        </div>

        <div class="ca-table-wrap">
            <table class="ca-table" id="caTable">
                <thead>
                    <tr>
                        <th colspan="5" class="header-group-label group-info">접수 정보</th>
                        <th colspan="8" class="header-group-label group-result">검정 결과</th>
                    </tr>
                    <tr>
                        <th class="col-checkbox sticky-col"><input type="checkbox" id="selectAll" title="전체 선택"></th>
                        <th class="col-reception sticky-col">접수번호</th>
                        <th class="col-farm">농장명</th>
                        <th class="col-sampletype">시료종류</th>
                        <th class="col-animal">축종</th>
                        <th class="col-result">함수율<br><small>%</small></th>
                        <th class="col-result">부숙도</th>
                        <th class="col-result">구리<br><small>mg/kg</small></th>
                        <th class="col-result">아연<br><small>mg/kg</small></th>
                        <th class="col-result">염분<br><small>%</small></th>
                        <th class="col-result">질소<br><small>%</small></th>
                        <th class="col-result">인산<br><small>%</small></th>
                        <th class="col-result">칼리<br><small>%</small></th>
                    </tr>
                </thead>
                <tbody id="caTableBody"></tbody>
            </table>
        </div>
